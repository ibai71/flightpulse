version: 2

sources:
  - name: ingestion
    schema: "{{ env_var('DBT_SOURCE_SCHEMA', 'staging') }}"
    tables:
      - name: bts_flights
        description: Typed flight-level records loaded by the PySpark batch pipeline.
      - name: adsb_observations
        description: Deduplicated timestamped path observations loaded from streaming Parquet.
